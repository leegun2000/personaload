[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personaload"
version = "0.1.0"
description = "Load benchmark for OpenAI-compatible LLM servers with character-chat and RAG-shaped traffic: $/1M output tokens, $/1K turns and $/session at your latency SLO (built on AIPerf)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "leegun2000" }]
keywords = ["llm", "benchmark", "load-testing", "inference", "vllm", "sglang", "llama.cpp", "prefix-caching", "rag", "slo", "finops", "aiperf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Benchmark",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiperf==0.12.0",
    "pydantic>=2.10,<3",
    "ruamel.yaml>=0.18",
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/leegun2000/personaload"
Source = "https://github.com/leegun2000/personaload"
Issues = "https://github.com/leegun2000/personaload/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
personaload = "personaload.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# SIM905: word banks read better as prose strings split at import time
ignore = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: runs the pinned AIPerf package, some against the mock server"]
