[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personaload"
version = "0.1.0"
description = "Character-chat workload benchmark for OpenAI-compatible LLM servers, driven by AIPerf"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiperf==0.12.0",
    "pydantic>=2.10,<3",
    "ruamel.yaml>=0.18",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
personaload = "personaload.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# SIM905: word banks read better as prose strings split at import time
ignore = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs the pinned AIPerf package, some against the mock server"]
