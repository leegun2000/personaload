# Knowledge-base (RAG) support chatbot. Every conversation shares one instruction prompt (system), and a new
# retrieved document goes in front of every question.
# The cost is driven by input (documents), not output, so read $/1K turns and $/session as cost per answer/conversation.
# Documents stay in the history, so later turns grow (more than in an app that drops old retrieval results).
# Target: vLLM on a GPU server (scripts/vllm-linux.sh). 3m30s per stage, ~11 min total.
name: rag-assistant
seed: 7

target:
  base_url: http://127.0.0.1:8000/v1
  model: local-model
  timeout: 120s

personas:
  count: 1                            # one instruction prompt shared by every conversation
  system_prompt_tokens: {min: 1500, max: 1500}

session:
  language: ko
  turns: {min: 2, max: 6}
  user_input_tokens: {dist: lognormal, mean: 40, stddev: 20, min: 5, max: 200}
  retrieved_tokens: {min: 800, max: 2000}
  max_output_tokens: {min: 150, max: 400}
  think_time: {dist: exponential, mean: 20s, min: 3s, max: 60s}

load:
  mode: concurrency
  stages:
    - {concurrency: 10, duration: 3m, warmup: 30s}
    - {concurrency: 30, duration: 3m, warmup: 30s}
    - {concurrency: 60, duration: 3m, warmup: 30s}

slo:
  ttft_p95: 2s
  itl_p95: 100ms
  error_rate_max: 0.01

cost:
  gpu_hourly_usd: 1.09
  gpu_count: 1
  label: RunPod L40S
