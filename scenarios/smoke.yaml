# A ~1 minute check against llama.cpp on a Mac (scripts/llama-cpp-macos.sh) or `personaload mockserver`.
name: smoke
seed: 1

target:
  base_url: http://127.0.0.1:8000/v1
  model: local-model
  timeout: 60s
  max_tokens_field: max_tokens        # accepted by llama.cpp, vLLM and the mock

personas:
  count: 3
  system_prompt_tokens: {min: 200, max: 400}

session:
  turns: {min: 2, max: 4}
  user_input_tokens: {dist: lognormal, mean: 30, stddev: 15, min: 5, max: 100}
  max_output_tokens: {min: 32, max: 96}
  think_time: {dist: exponential, mean: 2s, min: 500ms, max: 8s}

load:
  mode: concurrency
  stages:
    - {concurrency: 2, duration: 15s, warmup: 3s}
    - {concurrency: 4, duration: 15s, warmup: 3s}

slo:
  ttft_p95: 2s
  itl_p95: 100ms
  error_rate_max: 0.01

cost:
  gpu_hourly_usd: 0                   # local machine: costs come out as $0
  label: local
