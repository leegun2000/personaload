# 약 1분짜리 동작 확인. 맥북 llama.cpp(scripts/llama-cpp-macos.sh)나 `personaload mockserver`를 대상으로 한다.
name: smoke
seed: 1

target:
  base_url: http://127.0.0.1:8000/v1
  model: local-model
  timeout: 60s
  max_tokens_field: max_tokens        # llama.cpp·vLLM·mock 모두 받는 필드

personas:
  count: 3
  system_prompt_tokens: {min: 200, max: 400}

session:
  turns: {min: 2, max: 4}
  user_input_tokens: {dist: lognormal, mean: 30, stddev: 15, min: 5, max: 100}
  max_output_tokens: {min: 32, max: 96}
  think_time: {dist: exponential, mean: 2s, min: 500ms, max: 8s}

load:
  mode: concurrency
  stages:
    - {concurrency: 2, duration: 15s, warmup: 3s}
    - {concurrency: 4, duration: 15s, warmup: 3s}

slo:
  ttft_p95: 2s
  itl_p95: 100ms
  error_rate_max: 0.01

cost:
  gpu_hourly_usd: 0                   # 로컬 장비: 원가는 $0으로 나온다
  label: local
