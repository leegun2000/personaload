# Long conversations of 30-50 turns. History grows the input to ~11k tokens on average (up to ~25k).
# Target: a server with max-model-len >= 32k (the scripts/vllm-linux.sh default). 5m30s per stage, ~11 min total.
name: long-context
seed: 7

target:
  base_url: http://127.0.0.1:8000/v1
  model: local-model
  timeout: 180s
  # extra_body: {chat_template_kwargs: {enable_thinking: false}}   # Qwen3: turn thinking off

personas:
  count: 20
  system_prompt_tokens: {min: 1500, max: 3000}

session:
  turns: {min: 30, max: 50}
  user_input_tokens: {dist: lognormal, mean: 40, stddev: 20, min: 5, max: 200}
  max_output_tokens: {min: 100, max: 250}
  think_time: {dist: exponential, mean: 5s, min: 1s, max: 30s}
  persona_selection: zipf
  zipf_s: 1.1

load:
  mode: concurrency
  stages:
    - {concurrency: 8, duration: 5m, warmup: 30s}
    - {concurrency: 32, duration: 5m, warmup: 30s}

slo:
  ttft_p95: 2s
  itl_p95: 100ms
  error_rate_max: 0.01

cost:
  gpu_hourly_usd: 1.09
  gpu_count: 1
  label: RunPod L40S
